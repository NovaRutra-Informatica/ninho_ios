name: iOS — verificação manual no Mac

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode instalado
        run: xcodebuild -version
      - name: Core, app, integração Apple e interface
        run: bash scripts/test-macos.sh
      - name: Resultados sintéticos do Xcode
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ninho-ios-xcresults
          path: TestResults/*.xcresult
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7
